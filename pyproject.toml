[project]
name = "podcastiq"
version = "0.1.0"
description = "YouTube Podcast RAG Application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4.8",
    "youtube-transcript-api>=1.2.4",
]

[tool.uv.build-backend]
module-name = "backend"
module-root = "."

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"