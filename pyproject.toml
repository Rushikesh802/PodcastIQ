
[project]
name = "podcastiq"
version = "0.1.0"
description = "YouTube Podcast RAG Application"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "langchain>=1.0.0",
    "langchain-cohere>=0.6.0",
    "langchain-mistralai>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.0",
    "numpy>=2.2.6,<3",
    "pandas>=2.2.3,<3",
    "streamlit>=1.40.0",
    "youtube-transcript-api>=1.2.0",
]

[tool.uv.build-backend]
module-name = "backend"
module-root = "."

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
