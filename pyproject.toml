[project]
name = "podcastiq"
version = "0.1.0"
description = "YouTube Podcast RAG Application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "langchain>=1.4.8",
    "langchain-classic>=1.0.8",
    "langchain-google-genai>=4.4.2",
    "langchain-openrouter>=0.2.9",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
    "youtube-transcript-api>=1.2.4",
]

[tool.uv.build-backend]
module-name = "backend"
module-root = "."

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
